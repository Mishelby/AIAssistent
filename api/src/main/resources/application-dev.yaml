spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DEV_HOST}:${DEV_LOCAL_PORT}/${DEV_DB_NAME}
    username: ${DEV_LOGIN}
    password: ${DEV_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: students
    default-schema: students
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      platform: postgres

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

server:
  port: 8081

---

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

telegram:
  api-key: ${TELEGRAM_API_KEY}