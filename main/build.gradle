import org.springframework.boot.gradle.tasks.run.BootRun

dependencies {
    implementation project(':core')
    implementation project(':infrastructure-kafka')

    implementation 'chat.giga:langchain4j-gigachat:0.1.11'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.5'
    implementation 'org.springframework:spring-webflux'
    implementation 'com.h2database:h2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.milvus:milvus-sdk-java:2.3.6'

    implementation 'io.prometheus:prometheus-metrics-core:1.3.1'
    implementation 'io.prometheus:prometheus-metrics-instrumentation-jvm:1.3.1'
    implementation 'io.prometheus:prometheus-metrics-exporter-httpserver:1.3.1'

    testImplementation 'org.springframework.kafka:spring-kafka-test'
    runtimeOnly 'org.postgresql:postgresql'
}

springBoot {
    mainClass.set('ru.development.core.MainApplication')
}

tasks.register('debug', BootRun) {
    dependsOn 'classes'
    group = 'application'
    description = 'Run the Spring Boot app with debug enabled and dev profile'
    args = ['--spring.profiles.active=dev']
    jvmArgs = ['-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005']
    classpath = sourceSets.main.runtimeClasspath
}